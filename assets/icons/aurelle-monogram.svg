<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer luxury fine ring -->
  <circle cx="50" cy="50" r="46" stroke="#C5A880" stroke-width="1.75" stroke-opacity="0.9" />
  <!-- Secondary concentric dashed ring -->
  <circle cx="50" cy="50" r="40" stroke="#C5A880" stroke-width="1" stroke-dasharray="2.5 3" stroke-opacity="0.6" />
  
  <!-- Primary Radiant Diamond Petals (Curved 4-pointed star) -->
  <path d="M50 14 C51 32 68 49 86 50 C68 51 51 68 50 86 C49 68 32 51 14 50 C32 49 49 32 50 14 Z" fill="url(#aurelleGoldGrad)" stroke="#C5A880" stroke-width="1.25" stroke-linejoin="round" />
  
  <!-- Secondary Diagonal Radiant Rays (Faceted 45-degree star) -->
  <path d="M50 27 C51.5 39 61 48.5 73 50 C61 51.5 51.5 61 50 73 C48.5 61 39 51.5 27 50 C39 48.5 48.5 39 50 27 Z" fill="#FAF8F4" fill-opacity="0.3" stroke="#DFC8A8" stroke-width="1" stroke-linejoin="round" />
  
  <!-- Subtle Internal Facet Axes -->
  <line x1="50" y1="20" x2="50" y2="80" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.7" />
  <line x1="20" y1="50" x2="80" y2="50" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.7" />
  
  <!-- Central Radiance Core -->
  <circle cx="50" cy="50" r="5" fill="#C5A880" />
  <circle cx="50" cy="50" r="2.2" fill="#FFFFFF" />

  <defs>
    <linearGradient id="aurelleGoldGrad" x1="14" y1="14" x2="86" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5D3B8" />
      <stop offset="35%" stop-color="#C5A880" />
      <stop offset="70%" stop-color="#B89768" />
      <stop offset="100%" stop-color="#99784D" />
    </linearGradient>
  </defs>
</svg>
